[package]
name = "igpu-linear-bridge"
version = "0.1.0"
edition = "2021"
description = "LD_PRELOAD GBM modifier bridge for NVIDIA render offload to an Intel iGPU compositor"
license = "MIT"

[lib]
name = "igpu_linear_bridge"
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
